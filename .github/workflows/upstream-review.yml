name: Upstream update review

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-update-review
  cancel-in-progress: false

jobs:
  propose-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out approved master
        # actions/checkout v6.0.2 — pinned to an immutable commit for supply-chain safety.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: master

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch official upstream
        run: |
          git remote add upstream https://github.com/acmesh-official/acme.sh.git
          git fetch upstream master

      - name: Detect new upstream commits
        id: changes
        shell: bash
        run: |
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or refresh review branch
        if: steps.changes.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="update/upstream-review"

          # Always start from our approved master so fork-only files are preserved.
          git checkout -B "$BRANCH" master

          # Merge official upstream history without publishing anything if a conflict occurs.
          if ! git merge --no-ff --no-edit upstream/master; then
            git merge --abort || true
            echo "Upstream merge has conflicts. Manual review is required; no review branch was pushed."
            exit 1
          fi

          # This branch is automation-owned. Do not add manual commits to it.
          git push --force-with-lease origin "$BRANCH"

      - name: Open pull request for manual review
        if: steps.changes.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh pr list --base master --head update/upstream-review --state open --json number --jq 'length' | grep -q '^0$'; then
            gh pr create \
              --base master \
              --head update/upstream-review \
              --title "Review upstream acme.sh updates" \
              --body "Automated proposal merging new commits from the official acmesh-official/acme.sh master branch into this fork's approved master. Fork-only files are preserved. Review commits, Files changed, and required checks before merging. The update/upstream-review branch is automation-owned; do not commit to it manually. Nothing is merged automatically."
          fi
